name: Build QuickCircle Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'quickcircle_final.zip'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract quickcircle_final.zip
        run: |
          set -e
          unzip -q quickcircle_final.zip -d "$GITHUB_WORKSPACE/build_src"
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build_src" -name "gradlew" -maxdepth 3 | head -1 | xargs dirname)
          echo "Project root: $PROJECT_DIR"
          ls "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('build_src/**/gradle-wrapper.properties', 'build_src/**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Android SDK
        run: |
          set -e
          ANDROID_HOME_DIR="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME_DIR/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-raw
          mv /tmp/cmdline-tools-raw/cmdline-tools "$ANDROID_HOME_DIR/cmdline-tools/latest"
          export ANDROID_HOME="$ANDROID_HOME_DIR"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME_DIR" >> $GITHUB_ENV
          echo "$ANDROID_HOME_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME_DIR/platform-tools" >> $GITHUB_PATH

      - name: Verify Gradle wrapper JAR
        run: |
          JAR="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
          if [ -f "$JAR" ] && [ -s "$JAR" ]; then
            echo "✅ gradle-wrapper.jar OK ($(du -h "$JAR" | cut -f1))"
          else
            echo "Bootstrapping wrapper..."
            GRADLE_VER=$(grep distributionUrl "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" \
              | grep -oP 'gradle-\K[0-9.]+')
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -O /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp/gi
            /tmp/gi/gradle-${GRADLE_VER}/bin/gradle -p "$PROJECT_DIR" wrapper \
              --gradle-version "$GRADLE_VER" --distribution-type bin
          fi

      - name: Create debug keystore
        run: |
          KEYSTORE="$PROJECT_DIR/debug.keystore"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storetype JKS 2>/dev/null
          echo "✅ Keystore created"

      - name: Make gradlew executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      # pipefail ensures Gradle's exit code propagates through tee
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Java:         $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "Project:      $PROJECT_DIR"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            2>&1 | tee "$GITHUB_WORKSPACE/build_output.txt"
          echo "✅ Gradle exited 0"

      - name: Find and verify APK
        run: |
          set -e
          echo "=== Searching for APK files ==="
          find "$GITHUB_WORKSPACE" -name "*.apk" 2>/dev/null && echo "---" || echo "none in GITHUB_WORKSPACE"

          APK_PATH=$(find "$GITHUB_WORKSPACE" -path "*/apk/debug/*.apk" 2>/dev/null | head -1)
          [ -z "$APK_PATH" ] && APK_PATH=$(find "$GITHUB_WORKSPACE" -name "*debug*.apk" 2>/dev/null | head -1)
          [ -z "$APK_PATH" ] && APK_PATH=$(find "$GITHUB_WORKSPACE" -name "*.apk" 2>/dev/null | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found"
            exit 1
          fi

          echo "✅ APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK_NAME=$(basename "$APK_PATH")" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickCircle-debug-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        run: |
          echo "## ✅ QuickCircle Debug APK Built" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`$APK_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $(du -h "$APK_PATH" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | \`QuickCircle-debug-APK\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$GITHUB_SHA\` |" >> $GITHUB_STEP_SUMMARY

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "=== BUILD LOG (last 150 lines) ==="
          tail -150 "$GITHUB_WORKSPACE/build_output.txt" 2>/dev/null || echo "(no build log)"
          echo ""
          echo "=== PROJECT_DIR contents ==="
          ls -la "$PROJECT_DIR/" 2>/dev/null || echo "(PROJECT_DIR not accessible)"
          echo ""
          echo "=== app/build dir ==="
          find "$PROJECT_DIR/app/build" -maxdepth 4 2>/dev/null | head -40 || echo "(no build dir)"
